<style>

.watermark
   {
      display:block;
	  margin-top:1%;
      z-index: 99999; 
      width: 100%;
  position:fixed;

  text-align:center!important;
   }
   .watermark img
   {
    opacity: 0.5;
    filter: alpha(opacity=15);
	rotate: 0deg;
   }

<body >
	
     <div class="watermark">
      <div><img alt="error" src="images/error.gif" /></div>
    </div>
    
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<div class="login100-form-title" style="background-image: url(images/bg-02.jpg);">
					<span class="login100-form-title-1">
						<h4 style="color:#AFECF4">Maintenance Tracker System </h4>
					</span>
				</div>

				<form class="login100-form validate-form" id="form_login">
					<div class="wrap-input100 validate-input m-b-26" data-validate="Username is required">
						<span class="label-input100">Username</span>
						<input class="input100" type="text" id="Name" name="username" 
                        placeholder="Enter username" disabled>
						<span class="focus-input100"></span>
					</div>

					<div class="wrap-input100 validate-input m-b-18" data-validate = "Password is required">
						<span class="label-input100">Password</span>
						<input class="input100" type="password" id="Password" name="pass" 
                        placeholder="Enter password" disabled>
						<span class="focus-input100"></span>
					</div>
          
					<br>
                    <div class="container-login100-form-btn">
                    <p style="color:red">
                    	Invalied system license Please connect your system developer or  
                        click <a href="https://QMS-EGYPT.com">here</a> to visit our website to get 
                        the contact info.
                    </p>
                    </div>
					<div class="container-login100-form-btn">
						<input type="submit" value="Login" class="login100-form-btn btn-dark" disabled>
				     <br>

                        <p class="" style="font-weight:bold; font-size:10px">
