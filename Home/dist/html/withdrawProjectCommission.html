<html>
 <div class="container-fluid">
  <select class="form-control empData" id="salesCode"></select>
  <div class="row w-100 commisionData"></div>
 </div>
</html>
<script>
 $(document).ready(function(){
  $("#salesCode").load("dist/php/empCode.php");  
  $(".empData").change(function(){
   var rowId = $(this).val();
   $.ajax({
    url:'dist/php/getAllSalesCommissionData.php',
    type:"POST",
    data:{orderId:rowId},
    success: function(getSalesCommissionData){
     $(".commisionData").html('');
     $(".commisionData").html(getSalesCommissionData); 
    }
   });
   return false;
  });
});
    
</script>
