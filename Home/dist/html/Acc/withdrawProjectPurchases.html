<!DOCTYPE html>
<html>
<style>
 #withdrawProjectPurchasesForm .form-control{transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;}
 #withdrawProjectPurchasesForm .form-control:focus{box-shadow: 0 0 0 0.2rem rgba(40,167,69,.25);}
 #withdrawProjectPurchasesForm .amountPreview{font-size: .85rem; color:#6c757d; margin-top:.25rem;}
 #withdrawProjectPurchasesForm .invalid-feedback{display:none;}
 #withdrawProjectPurchasesForm .is-invalid ~ .invalid-feedback,
 #withdrawProjectPurchasesForm .invalid-feedback.show{display:block;}
 #saveProjectPurchasesWithdraw{transition: transform .1s ease-in-out;}
 #saveProjectPurchasesWithdraw:active{transform: scale(0.97);}
</style>
 <div id="withdrawProjectPurchasesForm">
  <div class="row">
   <div class="form-group col-md-2">
    <label for="withdrawProjectPurchasesDate">Date</label>
    <input type="date" class="form-control" id="withdrawProjectPurchasesDate">
    <div class="invalid-feedback">Date is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="accountName1">Account</label>
    <select class="form-control" id="accountName1"><option value="312100100000">مشتريات بغرض البيع</option></select>
    <div class="invalid-feedback">Account is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="withdrawProjectPurchasesRecipient">Recipient</label>
    <input class="form-control" id="withdrawProjectPurchasesRecipient" type="text">
    <div class="invalid-feedback">Recipient is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="withdrawProjectPurchasesAmount">Amount</label>
    <input type="number" class="form-control" id="withdrawProjectPurchasesAmount">
    <div class="amountPreview"></div>
    <div class="invalid-feedback">Amount is required</div>
   </div>
   <div class="form-group col-md-3">
    <label for="withdrawProjectPurchasesDiscrebtion">Description</label>
    <textarea class="form-control" id="withdrawProjectPurchasesDiscrebtion"></textarea>
    <div class="invalid-feedback">Description is required</div>
   </div>
   <div class="form-group col-md-1 d-flex align-items-end">
    <button class="btn btn-success w-100" id="saveProjectPurchasesWithdraw">Save</button>
   </div>
  </div>
  <div class="alert msg" role="alert" style="display:none;"></div>
 </div>
 <script src="dist/js/pages/accountant/projectPurchasesWithdraw.js"></script>
</html>
