<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
 </head>
 <body>
  <center>
   <div class="table-responsive-lg">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>Project (Customer Po )</th>
      </thead>
     <tbody>
      <td><select class="form-control" id="allProjectExpencess2"></select></td>
     </tbody>
    </table>
   </div>
  </center>
  <hr>
  <div class="projectProfit"></div>
 </body>
<script type="text/javascript">
 $(document).ready(function(){
  $("#allProjectExpencess2").load("dist/php/Acc/allProjectsList.php");
  $("#allProjectExpencess2").change(function(){
   var poId = $("#allProjectExpencess2").val();
   $.ajax({
    url:'dist/php/Acc/profitProject.php',
    type:"POST",
    data:{project:poId},
    success: function(getProfitProject){
     $(".projectProfit").html(getProfitProject);
    }
   });
   return false;
  });  
 });
</script>
