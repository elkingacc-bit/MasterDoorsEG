<!DOCTYPE html>
<html>
 <center>
  <div class="table-responsive-lg">
   <table class="table table-sm w-100 table-borderless">
    <thead class="text-center">
     <th>Account الحساب</th>
     <th>Year السنة</th>
     <th>Month الشهر</th>
     <th>Budget Amount المبلغ</th>
     <th>Save</th>
    </thead>
    <tbody>
     <td>
      <select class="form-control" id="budgetAccount"></select>
     </td>
     <td>
      <select class="form-control" id="budgetYear"></select>
     </td>
     <td>
      <select class="form-control" id="budgetMonth"></select>
     </td>
     <td>
      <input type="number" step="0.01" min="0" class="form-control" id="budgetAmount">
     </td>
     <td>
      <button class="btn btn-success w-100" id="saveNewBudget">Save</button>
     </td>
    </tbody>
   </table>
  </div>
  <div class="alert msg" role="alert"></div>
  <h5 class="mt-3">Budget Lines خطوط الموازنة</h5>
  <div class="budgetListResult"></div>
 </center>
 <script src="dist/js/pages/accountant/addNewBudget.js"></script>
</html>
