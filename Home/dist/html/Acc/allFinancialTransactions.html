<!DOCTYPE html>
<html>
 <center>
  <div class="btn-group" role="group">
   <button class="btn btn-info" id="monthFinancelTransaction">Month</button>
   <button class="btn btn-primary" id="allFinancelTransaction">All</button>
  </div>
  <div class="table-responsive-lg">  
   <div class="monthFinancelTransaction" style="display: none;">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>Year</th>
      <th>Month</th>
      <th></th>
     </thead>
     <tbody>
      <td>
       <select id="financelTransactionYear" class="form-control"></select>
      </td>
      <td>
       <select id="financelTransactionMonth" class="form-control">
        <option value="">Choose</option>
        <option value="1">Jan</option>
        <option value="2">Feb</option>
        <option value="3">Mar</option>
        <option value="4">Apr</option>
        <option value="5">May</option>
        <option value="6">Jun</option>
        <option value="7">Jul</option>
        <option value="8">Aug</option>
        <option value="9">Sep</option>
        <option value="10">Oct</option>
        <option value="11">Nov</option>
        <option value="12">Dec</option>
       </select>
      </td>
      <td>
       <button class="btn btn-success" id="showFinancelTransaction">Display</button>
      </td>
     </tbody>
    </table>    
   </div>
  </div>
 </center> 
 <div class="financelTransactionData"></div>
 <script src="dist/js/pages/accountant/financalTransactionReport.js"></script>
</html>
