<!DOCTYPE html>
<html>
<style>
 #settlementForm .form-control{transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;}
 #settlementForm .form-control:focus{box-shadow: 0 0 0 0.2rem rgba(40,167,69,.25);}
 #settlementForm .invalid-feedback{display:none;}
 #settlementForm .is-invalid ~ .invalid-feedback,
 #settlementForm .invalid-feedback.show{display:block;}
 #settlementForm .entryRow{border:1px solid #eee; border-radius:.25rem; padding:.75rem .25rem; margin-bottom:.5rem;}
 #settlementAdd, #settlementSave{transition: transform .1s ease-in-out;}
 #settlementAdd:active, #settlementSave:active{transform: scale(0.97);}
 #settlementBalance{font-size:.9rem; margin-top:.5rem;}
</style>
 <center id="settlementForm">
  <input value="2" id="entryCount" hidden>
  <div class="row entryRow">
   <div class="col-md-1"><span class="badge badge-secondary">1</span></div>
   <div class="form-group col-md-2">
    <label for="receDate1">Date</label>
    <input type="date" id="receDate1" class="form-control">
    <div class="invalid-feedback">Date is required</div>
   </div>
   <div class="form-group col-md-3">
    <label for="accountName1">Account</label>
    <select class="form-control" id="accountName1"></select>
    <div class="invalid-feedback">Account is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="debtorAmount1">Debtor</label>
    <input type="number" id="debtorAmount1" value="0" class="form-control">
   </div>
   <div class="form-group col-md-2">
    <label for="creditorAmount1">Creditor</label>
    <input type="number" id="creditorAmount1" value="0" class="form-control">
   </div>
   <div class="form-group col-md-2">
    <label for="receivDescription1">Description</label>
    <input type="text" id="receivDescription1" class="form-control">
    <div class="invalid-feedback">Description is required</div>
   </div>
  </div>

   </div>
  </div>
  <div class="row entryRow entry4">

  <div class="card-footer text-muted">

 <script src="dist/js/pages/accountant/addAccountantSettlement.js"></script>
