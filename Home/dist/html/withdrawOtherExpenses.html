<!DOCTYPE html>
<html>
<style>
 #withdrawOtherExpensesForm .form-control{transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;}
 #withdrawOtherExpensesForm .form-control:focus{box-shadow: 0 0 0 0.2rem rgba(40,167,69,.25);}
 #withdrawOtherExpensesForm .amountPreview{font-size: .85rem; color:#6c757d; margin-top:.25rem;}
 #withdrawOtherExpensesForm .invalid-feedback{display:none;}
 #withdrawOtherExpensesForm .is-invalid ~ .invalid-feedback,
 #withdrawOtherExpensesForm .invalid-feedback.show{display:block;}
 #saveOtherExpensesWithdraw{transition: transform .1s ease-in-out;}
 #saveOtherExpensesWithdraw:active{transform: scale(0.97);}
</style>
 <div id="withdrawOtherExpensesForm">
  <div class="row">
   <div class="form-group col-md-2">
    <label for="withdrawOtherExpensesDate">Date</label>
    <input type="date" class="form-control" id="withdrawOtherExpensesDate">
    <div class="invalid-feedback">Date is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="accountName3">Account</label>
    <select class="form-control" id="accountName3"></select>
    <div class="invalid-feedback">Account is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="withdrawOtherExpensesRecipient">Recipient</label>
    <select class="form-control" id="withdrawOtherExpensesRecipient"></select>
    <div class="invalid-feedback">Recipient is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="withdrawOtherExpensesAmount">Amount</label>
    <input type="number" class="form-control" id="withdrawOtherExpensesAmount">
    <div class="amountPreview"></div>
    <div class="invalid-feedback">Amount is required</div>
   </div>
   <div class="form-group col-md-3">
    <label for="withdrawOtherExpensesDiscrebtion">Description</label>
    <textarea class="form-control" id="withdrawOtherExpensesDiscrebtion"></textarea>
    <div class="invalid-feedback">Description is required</div>
   </div>
   <div class="form-group col-md-1 d-flex align-items-end">
    <button class="btn btn-success w-100" id="saveOtherExpensesWithdraw">Save</button>
   </div>
  </div>
  <div class="alert msg" role="alert" style="display:none;"></div>
 </div>
 <script src="dist/js/pages/accountant/otherExpensesWithdraw.js"></script>
</html>
