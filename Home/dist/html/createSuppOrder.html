<!doctype html>
<html>

<script type="text/javascript" src="dist/js/createSuppOrder.js"></script>
<div class="panel panel-primary" style="width:99%">
<div class="panel-heading">
</div>
    <div class="panel-body">
    
    <div class="table-responsive">

    <tbody>
    <tr>
   <td>

    </td>
    
    <td>

    </tr>

</table>
  </div>  
    <center><button class="btn btn-sm btn-success" id="addNewSuppOrderBtn">Save</button></center>
    </div>
