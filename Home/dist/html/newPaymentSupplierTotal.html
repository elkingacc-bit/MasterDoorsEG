<!DOCTYPE html>
<html>
 <center>
  <div class="table-responsive-lg">
   <table class="table table-sm table-borderless">
    <thead class="text-center">
     <th>Choose Supplier</th>
     <th></th>
    </thead>
    <tbody>
     <td>
      <input type="text" id="chooseSupplierInvoice" name="chooseSupplierInvoice" class="form-control" autocomplete="off" list="supplierInvoice">
      <datalist id="supplierInvoice"></datalist> 
    </td>
    <td><button class="btn btn-info" id="supplierAccount">Submit</button></td>
    </tbody>
   </table>
  </div>
 </center>
 <script type="text/javascript">
  $(document).ready(function(){
   $("#supplierInvoice").load("dist/php/allSuppDDList.php");
   $("#supplierAccount").click(function(){
    var data = {};
    $("#supplierInvoice option").each(function(i,el) {  
     data[$(el).data("value")] = $(el).val();
    });
    console.log(data, $("#supplierInvoice option").val());
    var suplierCode = $("#chooseSupplierInvoice").val();
    var invSuplier = $('#supplierInvoice [value="' + suplierCode + '"]').data('value');
    var suplierChosenValideate = $('#supplierInvoice [value="' + suplierCode + '"]');  
    if(suplierChosenValideate.length <= 0){
     alert('Please Choose Suppliers name from the list');
     $("#chooseSupplierInvoice").css("border-color","red");
     setTimeout(function(){
      $("#chooseSupplierInvoice").css("border-color","#EBEBEB");               
      $("#chooseSupplierInvoice").val(''); 
      $("#chooseSupplierInvoice").focus();             
     }, 1500);
    }
    else{
     $.ajax({
      url:'dist/php/suppliersInvoiceData.php',
      type:"POST",
      data:{supId:invSuplier},
      success: function(getSuppliersInvoice){
       $(".data_display").html(getSuppliersInvoice);
      }
     });
    }
   });
  }); 
 </script>
</html>
