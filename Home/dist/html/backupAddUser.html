<div class="panel panel-primary" style="width:99%">
<div class="panel-heading">
<p></p>
</div>
<div class="panel-body">
<div class="form-group has-feedback field-wrap">
<form id="addUserForm" enctype="multipart/form-data" method="post">
<table class="table">
<tr>
<th>Full Name</th>
<th>User Name</th>
</tr>
<tr>
<td><input type="text" id="fullName" name="flName" class="form-control" placeholder="Full Name" /></td>

</tr>

 <span class="glyphicon form-control-feedback" id="confirmPassword1"></span>

</tr>

</select></td>
<td>
  <input class="form-control-file" type="file" id="photo" name="sourceFile">

<tr><td colspan="2"><br></td></tr>

<td colspan="2" align="center">
<input  id="saveUserBtn" type="submit" class="btn btn-success" value="Save"/>

</tr>

</div>
</div>
