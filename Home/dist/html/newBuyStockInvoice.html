<!DOCTYPE html>
<html>
<style>
 #buyStockInvoiceForm .form-control{transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;}
 #buyStockInvoiceForm .form-control:focus{box-shadow: 0 0 0 0.2rem rgba(40,167,69,.25);}
 #buyStockInvoiceForm .invalid-feedback{display:none;}
 #buyStockInvoiceForm .is-invalid ~ .invalid-feedback,
 #buyStockInvoiceForm .invalid-feedback.show{display:block;}
 #saveInvoice, #saveItems{transition: transform .1s ease-in-out;}
 #saveInvoice:active, #saveItems:active{transform: scale(0.97);}
</style>
 <center id="buyStockInvoiceForm">
  <div class="row justify-content-center">
   <div class="form-group col-md-2">
    <label for="invoiceNumber">Invoice Number</label>
    <input type="text" class="form-control" id="invoiceNumber">
    <div class="invalid-feedback">Invoice number is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="invoiceDate">Date</label>
    <input type="date" class="form-control" id="invoiceDate">
    <div class="invalid-feedback">Date is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="chooseSuppliers">Supplier</label>
    <input type="text" id="chooseSuppliers" name="chooseSuppliers" class="form-control" autocomplete="off" list="suppliers">
    <datalist id="suppliers"></datalist>
    <div class="invalid-feedback">Supplier is required</div>
   </div>
   <div class="form-group col-md-1">
    <label for="invoiceSuptotal">Amount</label>
    <input type="number" class="form-control" id="invoiceSuptotal">
    <div class="invalid-feedback">Amount is required</div>
   </div>
   <div class="form-group col-md-2">
    <label for="vatType">VAT</label>
    <select class="form-control" id="vatType">
     <option value="">Choose</option>
     <option value="1">VAT</option>
     <option value="2">NOT VAT</option>
    </select>
    <input type="number" class="form-control" id="invoiceVat" style="display: none;">
    <div class="invalid-feedback">VAT is required</div>
   </div>
   <div class="form-group col-md-1">
    <label for="invoiceTotal">Total</label>
    <input type="number" class="form-control" id="invoiceTotal" readonly>
   </div>
   <div class="form-group col-md-2 d-flex align-items-end">
    <button class="btn btn-success w-100" id="saveInvoice">Save</button>
    <button class="btn btn-info w-100" id="AddItems">Add Items</button>
    <button class="btn btn-info w-100" id="closePage">Back</button>
   </div>
  </div>
  <h5 style="float:right;" class="reminingText"> Remaining : <span class="invRem" style="color: red;"></span> </h5>
  <input id="invoiceId" style="display: none">
  <input id="itemsValue" style="display: none">
  <div class="invoiceData"></div>
  <div class="alert msg" role="alert"></div>
  <!-- Modal -->
  <div class="modal fade" id="supplierInvoiceModal" aria-hidden="true" aria-labelledby="supplierModalData" tabindex="-1">
   <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable  modal-xl">
    <div class="modal-content">
     <div class="modal-header">
      <h5 class="modal-title" id="supplierModalData">Add Items To Invoice</h5>
      <button type="button" class="close" aria-label="Close"><span aria-hidden="true">&times;</span></button>
     </div>
     <div class="modal-body">
      <div class="row">
       <div class="form-group col-md-4">
        <label for="chooseItems">Items</label>
        <input type="text" id="chooseItems" name="chooseItems" class="form-control" autocomplete="off" list="items">
        <datalist id="items"></datalist>
       </div>
       <div class="form-group col-md-2">
        <label for="invoiceQyan">Quantity</label>
        <input type="number" class="form-control" id="invoiceQyan">
       </div>
       <div class="form-group col-md-2">
        <label for="unitPrice">Unit Price</label>
        <input type="number" class="form-control" id="unitPrice">
       </div>
       <div class="form-group col-md-2">
        <label for="supTotal">SupTotal</label>
        <input type="text" class="form-control" id="supTotal">
       </div>
       <div class="form-group col-md-2 d-flex align-items-end">
        <button class="btn btn-success w-100" id="saveItems">Save</button>
       </div>
      </div>
     </div>
     <div class="modal-footer msg"></div>
    </div>
   </div>
  </div>
 </center>
 <script src="dist/js/pages/accountant/addNewBuyStockItems.js"></script>
</html>
