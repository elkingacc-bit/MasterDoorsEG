<!DOCTYPE html>
<html>
<style>
 #accountantCodeForm .form-control{transition: border-color .15s ease-in-out, box-shadow .15s ease-in-out;}
 #accountantCodeForm .form-control:focus{box-shadow: 0 0 0 0.2rem rgba(40,167,69,.25);}
 #saveAccountCode{transition: transform .1s ease-in-out;}
 #saveAccountCode:active{transform: scale(0.97);}
</style>
 <div id="accountantCodeForm">
  <div class="row">
   <div class="form-group col-md-2">
    <label for="level1f">First Level Name</label>
    <select class="form-control" id="level1f"><option value="">Choose</option></select>
   </div>
   <div class="form-group col-md-2">
    <label for="level2">Second Level Name</label>
    <select class="form-control" id="level2"><option value="">Choose</option></select>
   </div>
   <div class="form-group col-md-2">
    <label for="level3">Third Level Name</label>
    <select class="form-control" id="level3"><option value="">Choose</option></select>
   </div>
   <div class="form-group col-md-3">
    <label for="AccountName">Account Name</label>
    <input type="text" class="form-control" id="AccountName">
   </div>
   <input class="form-control" id="accountantFullCode" hidden>
   <div class="form-group col-md-2 d-flex align-items-end">
    <button class="btn btn-success w-100" id="saveAccountCode">Save</button>
   </div>
  </div>
  <div class="oldCodeData"></div>
 </div>
 <script src="dist/js/pages/accountant/addAccountantFullCode.js"></script>
</html>
