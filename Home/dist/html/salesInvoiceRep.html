<!DOCTYPE html>
<html>
 <div class="btn-group" role="group" style="float: right;">
  <button class="btn btn-info" id="yearlySalesInvoice">Yearly</button>
  <button class="btn btn-primary" id="quarterSalesInvoice">Quarterly</button>
  <button class="btn btn-info" id="monthSalesInvoice">Monthly</button>
  <button class="btn btn-primary" id="limitSalesInvoice">Periodically</button>
  <button class="btn btn-info" id="customerSalesInvoice">Customer</button>
 </div>
 <center>
  <div class="table-responsive-lg">
   <div class="yearlySalesInvoice" style="display: none;">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>Year</th>
      <th></th>
     </thead>
     <tbody>
      <td>
       <select id="salesInvouceYear" class="form-control yearShow"></select>
      </td>
      <td>
       <button class="btn btn-success" id="showSalesInvouceYear">Show</button>
      </td>
     </tbody>
    </table>    
   </div>
   <div class="quarterSalesInvoice" style="display: none;">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>Year</th>
      <th>Quarter</th>
      <th></th>
     </thead>
     <tbody>
      <td>
       <select id="salesInvouceYearQ" class="form-control yearShow"></select>
      </td>
      <td>
       <select id="salesInvouceQuarter" class="form-control">
        <option value="">Choose</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
       </select>
      </td>
      <td>
       <button class="btn btn-success" id="showSalesInvouceQuarter">Show</button>
      </td>
     </tbody>
    </table>    
   </div>
   <div class="monthSalesInvoice" style="display: none;">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>Year</th>
      <th>Month</th>
      <th></th>
     </thead>
     <tbody>
      <td>
       <select id="salesInvouceYearM" class="form-control yearShow"></select>
      </td>
      <td>
       <select id="salesInvouceMonth" class="form-control">
        <option value="">Choose</option>
        <option value="1">Jan</option>
        <option value="2">Feb</option>
        <option value="3">Mar</option>
        <option value="4">Apr</option>
        <option value="5">May</option>
        <option value="6">Jun</option>
        <option value="7">Jul</option>
        <option value="8">Aug</option>
        <option value="9">Sep</option>
        <option value="10">Oct</option>
        <option value="11">Nov</option>
        <option value="12">Dec</option>
       </select>
      </td>
      <td>
       <button class="btn btn-success" id="showSalesInvouceMonth">Show</button>
      </td>
     </tbody>
    </table>    
   </div>
   <div class="limitSalesInvoice" style="display: none;">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>From</th>
      <th>To</th>    
      <th></th>
     </thead>
     <tbody>
      <td>
       <input type="date" id="startDate" class="form-control">
      </td>
      <td>
       <input type="date" id="endDate" class="form-control">
      </td>
      <td>
       <button class="btn btn-success" id="showLimitSalesInvoice">Show</button>
      </td>
     </tbody>
    </table>    
   </div>
   <div class="customerSalesInvoice" style="display: none;">
    <table class="table table-sm w-75 table-borderless">
     <thead class="text-center">
      <th>Customer</th>
      <th></th>
     </thead>
     <tbody>
      <td>
       <select id="accountName" class="form-control"></select>
      </td>
      <td>
       <button class="btn btn-success" id="showCustomerSalesInvoice">Show</button>
      </td>
     </tbody>
    </table>    
   </div>
  </div>
 </center>
 <div class="salesInvoiceReport"></div>
 <script src="dist/js/pages/accountant/salesInvoiceCustomReport.js"></script>
</html>
